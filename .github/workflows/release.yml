name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build binary (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --locked --release

      - name: Rename binary for the release
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/glyphc dist/glyphc-${{ matrix.os }}
          chmod +x dist/glyphc-${{ matrix.os }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/glyphc-*
[package]
name = "glyphc"
version = "2.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["MrModelOS"]
description = "Glyph language compiler — transpiles Glyph to C and AOT-compiles NeuralScript (.ns) to CPU/CUDA"
license = "MIT"
repository = "https://github.com/MrModelOS/Glyph"
homepage = "https://github.com/MrModelOS/Glyph"
readme = "README.md"
keywords = ["compiler", "language", "transpiler", "cuda"]
categories = ["compilers", "development-tools"]

# WARNING: Do not remove [lib] / [[bin]] — required for `cargo publish` (library + binary targets)
[lib]
name = "glyphc"
path = "src/lib.rs"

[[bin]]
name = "glyphc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde_json = "1"

[dev-dependencies]

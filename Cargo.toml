[package]
name = "glyphc"
version = "2.1.0"
edition = "2021"
description = "Glyph language compiler"
license = "MIT"

[lib]
name = "glyphc"
path = "src/lib.rs"

[[bin]]
name = "glyphc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "1"
serde_json = "1"

[dev-dependencies]

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build + test + examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Docs
        run: cargo doc --no-deps

      - name: Build
        run: cargo build --locked

      - name: Unit and integration tests
        run: cargo test --locked

      - name: Examples (glyphc run on every example)
        run: ./examples/run_all.sh

      - name: Release build
        run: cargo build --locked --release

      - name: Upload glyphc binary
        uses: actions/upload-artifact@v4
        with:
          name: glyphc-bin
          path: target/debug/glyphc
          if-no-files-found: error

  nns-smoke:
    name: NNS pipeline smoke tests
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Restore glyphc binary
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: glyphc-bin
          path: target/debug

      - name: Build glyphc if artifact is unavailable
        run: |
          if [ ! -x target/debug/glyphc ]; then
            cargo build --bin glyphc --locked
          fi
          test -x target/debug/glyphc

      - name: Install C++ smoke-test compiler
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Run NNS examples through the complete pipeline
        shell: bash
        run: |
          set -euo pipefail
          GLYPHC=target/debug/glyphc
          shopt -s nullglob
          EXAMPLES=(examples/nns/*.ns examples/nns/neumoe/*.ns)
          if [ "${#EXAMPLES[@]}" -eq 0 ]; then
            echo "No .ns examples found under examples/nns/"
            find examples -name '*.ns' -print
            exit 1
          fi
          printf 'Testing %d NNS examples\n' "${#EXAMPLES[@]}"
          failures=0

          run_case() {
            local label="$1"
            shift
            local out="/tmp/glyphc-nns-${label}.out"
            local err="/tmp/glyphc-nns-${label}.err"
            set +e
            "$GLYPHC" nns "$@" >"$out" 2>"$err"
            local rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "FAIL $label (exit $rc)"
              cat "$err"
              failures=1
              return 1
            fi
            if [ ! -s "$out" ]; then
              echo "FAIL $label (empty stdout)"
              failures=1
              return 1
            fi
            return 0
          }

          for ex in "${EXAMPLES[@]}"; do
            name=$(basename "$ex" .ns)
            echo "=== $name ==="

            if run_case "$name-check" "$ex" --check; then
              grep -qx 'Shape checking passed.' "/tmp/glyphc-nns-$name-check.out"
              test ! -s "/tmp/glyphc-nns-$name-check.err"
            fi

            if run_case "$name-cpp" "$ex" --cpp; then
              g++ -fsyntax-only -x c++ "/tmp/glyphc-nns-$name-cpp.out"
            fi

            if run_case "$name-cpp-runtime" "$ex" --cpp --runtime; then
              grep -q 'ns_runtime_' "/tmp/glyphc-nns-$name-cpp-runtime.out"
            fi

            if run_case "$name-simd" "$ex" --simd; then
              grep -q 'CPU SIMD backend requested' "/tmp/glyphc-nns-$name-simd.out"
            fi

            if run_case "$name-cuda" "$ex" --cuda; then
              grep -q 'cuda_runtime.h' "/tmp/glyphc-nns-$name-cuda.out"
            fi

            if run_case "$name-cuda-runtime" "$ex" --cuda --runtime; then
              grep -q 'ns_runtime_' "/tmp/glyphc-nns-$name-cuda-runtime.out"
            fi

            if run_case "$name-mlir" "$ex" --mlir; then
              grep -q 'ns\.' "/tmp/glyphc-nns-$name-mlir.out"
            fi
          done

          if [ "$failures" -ne 0 ]; then
            echo 'NNS smoke tests failed.'
            exit 1
          fi
          echo 'All NNS smoke tests passed.'

      - name: NNS reference policy
        run: |
          echo "NeuralScript was merged into glyphc; no external repository is cloned."
          echo "The smoke job validates the self-contained Rust pipeline for every shipped example."
          echo "A historical nsc binary can still be supplied manually for local byte-diffing."
